<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDGE VAULT |审计日志</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-size='48'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="preload" href="/fonts/orbitron-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/tailwind.css">
</head>
<body class="auth-body">
    <main class="shell pt-12 auth-shell">
        <section class="panel neon-border rounded-[1.4rem] px-4 py-5 md:px-7 md:py-7 auth-frame">
            <div class="flex flex-col gap-4 border-b border-cyan-900/60 pb-5 md:flex-row md:items-end md:justify-between">
                <div class="space-y-2">
                    <p class="section-title">Blackbox Protocol</p>
                    <h1 class="orbitron text-2xl font-bold tracking-[0.28em] text-cyan-300 md:text-4xl">EDGE VAULT</h1>
                    <p class="max-w-2xl text-sm leading-6 text-cyan-100/70 md:text-base">审计日志视图，默认展示最近 300 条事件记录。</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <span class="status-pill text-emerald-300">● 隧道运行中</span>
                    <span id="idle-countdown" class="status-pill idle-pill">60s</span>
                    <span id="logsUser" class="status-pill">ADMIN</span>
                </div>
            </div>

            <div class="mt-6 auth-layout">
                <aside class="panel neon-border rounded-[1.25rem] p-5 md:p-6 sidebar-panel">
                    <div class="space-y-5 sidebar-scroll">
                        <div class="metric">
                            <p class="section-title">Audit State</p>
                            <div class="mt-2 orbitron text-xl text-cyan-300 md:text-2xl">AUDIT LOG</div>
                            <p class="mt-3 text-sm leading-6 text-cyan-100/65">最近 <span id="logCount">--</span> 条记录，链完整性 <span id="chainText">校验中</span>。</p>
                        </div>

                        <div class="nav-grid">
                            <a href="/" class="nav-link">保险库</a>
                            <a href="/notes.html" class="nav-link">笔记</a>
                            <a href="/logs.html" class="nav-link active">日志</a>
                        </div>

                        <button type="button" id="btnLogout" class="btn-muted orbitron w-full">断开会话</button>

                        <div class="info-card text-sm leading-7 text-cyan-100/80">
                            <div>查看用户：<span id="logsUserInfo">ADMIN</span></div>
                            <div>链校验：<span id="chainTextInfo">校验中</span></div>
                        </div>
                    </div>
                </aside>

                <section class="panel neon-border rounded-[1.25rem] p-5 md:p-6 content-panel">
                    <div class="flex flex-col gap-4 border-b border-cyan-900/60 pb-5 md:flex-row md:items-end md:justify-between">
                        <div>
                            <p class="section-title">Security Timeline</p>
                            <h2 class="mt-2 text-lg font-semibold text-cyan-200 md:text-xl">系统审计日志</h2>
                        </div>
                        <span id="chainBadge" class="status-pill text-emerald-300">链完整性校验中…</span>
                    </div>

                    <div class="mt-5 content-scroll">
                        <div id="logsEmpty" class="empty-state hidden">当前没有可展示的日志记录。</div>
                        <div id="logsMobile" class="mobile-stack"></div>
                        <table id="logTable" class="desktop-table log-table mt-2 w-full text-left text-sm">
                            <colgroup>
                                <col style="width: 180px;">
                                <col style="width: 180px;">
                                <col style="width: 90px;">
                                <col style="width: 115px;">
                                <col>
                            </colgroup>
                            <thead>
                                <tr class="border-b border-cyan-900/70 text-cyan-600">
                                    <th class="pb-3 font-medium">时间</th>
                                    <th class="pb-3 font-medium">事件</th>
                                    <th class="pb-3 font-medium">用户</th>
                                    <th class="pb-3 font-medium">状态</th>
                                    <th class="pb-3 font-medium">详情</th>
                                </tr>
                            </thead>
                            <tbody id="logRows"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <footer class="footer-meta">
        <div>&copy; Edge Vault. Licensed under the Apache License 2.0</div>
        <div>GitHub:
            <a href="https://github.com/keaidang/edge-vault" target="_blank" rel="noopener noreferrer">keaidang</a></div>
    </footer>

    <script type="module">
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // 审计 detail 是自由文本：把 "k=v k2=v2" 拆成原版审计详情列表，其余整体作为「详情」
    const detailItems = raw => {
      const text = String(raw || '').trim();
      if (!text) return [];
      return text.split(/\s+/).filter(Boolean).map(part => {
        const eq = part.indexOf('=');
        return eq > 0 ? [part.slice(0, eq), part.slice(eq + 1)] : ['详情', part];
      });
    };
    const ACTION_LABELS = {
      SYSTEM_RESET: '系统重置', AUTH_LOGIN_SUCCESS: '登录成功', AUTH_LOGIN_FAILED: '登录失败',
      AUTH_LOGOUT: '退出登录', CHECKIN_SUCCESS: '签到成功', CHECKIN_FAILED: '签到失败',
      CHECKIN_CODE_UPDATED: '签到码更新', DURESS_CODE_UPDATED: '胁迫码更新', DURESS_TRIGGERED: '胁迫触发销毁',
      FILE_UPLOADED: '文件上传', FILE_DOWNLOADED: '文件下载', FILE_DELETED: '文件删除',
      NOTE_SAVED: '笔记保存', NOTE_DELETED: '笔记删除', NOTE_ACCESS_SUCCESS: '笔记读取',
      NOTE_ACCESS_FAILED: '笔记访问失败', NOTE_ATTACHMENT_DOWNLOADED: '附件下载',
      NOTE_ATTACHMENT_DELETED: '附件删除', NOTE_FEATURE_UPDATED: '笔记开关',
      USER_CREATED: '用户创建', USER_PASSWORD_UPDATED: '用户密钥更新',
      CONFIG_UPDATED: '配置调整', AUDIT_VIEWED: '查看日志', SYSTEM_DESTROYED: '系统销毁',
      SYSTEM_ARCHIVED: '日志归档', RATE_LIMIT_EXCEEDED: '触发限流', INVALID_REQUEST: '非法请求',
    };
    let csrf = '';
    async function api(p, o = {}) {
      const headers = { 'Content-Type': 'application/json', ...(o.headers || {}) };
      if (csrf && (o.method || 'GET') !== 'GET') headers['x-csrf-token'] = csrf;
      const r = await fetch(`/api/${p}`, { credentials: 'same-origin', ...o, headers });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.ok === false) { const e = new Error(d.error || `HTTP ${r.status}`); e.status = r.status; throw e; }
      return d;
    }
    (async () => {
      try {
        const st = await api('state');
        csrf = st.session?.csrf || '';
        if (st.session && $('logsUser')) $('logsUser').textContent = String(st.session.user).toUpperCase();
        if (st.session && $('logsUserInfo')) $('logsUserInfo').textContent = String(st.session.user).toUpperCase();
        const { entries, chain_ok: chainOk } = await api('logs');
        if ($('chainBadge')) {
          $('chainBadge').textContent = chainOk ? '链完整性校验通过' : '⚠ 链校验失败（疑似被篡改）';
          $('chainBadge').classList.toggle('text-emerald-300', !!chainOk);
          $('chainBadge').classList.toggle('text-red-300', !chainOk);
        }
        if ($('chainText')) $('chainText').textContent = chainOk ? '正常' : '异常';
        if ($('chainTextInfo')) $('chainTextInfo').textContent = chainOk ? '通过' : '失败';
        $('logCount').textContent = String(entries.length);
        $('logsEmpty').classList.toggle('hidden', entries.length > 0);
        const rows = $('logRows'), mobile = $('logsMobile');
        for (const e of entries) {
          const ts = new Date((e.ts || 0) * 1000).toLocaleString('zh-CN');
          const action = ACTION_LABELS[e.action] || e.action;
          const ok = e.success !== false;
          const badge = ok ? '<span class="status-pill text-emerald-300">SUCCESS</span>'
                           : '<span class="status-pill border-red-500/30 bg-red-500/10 text-red-300">FAILED</span>';
          const items = detailItems(e.detail);
          const detailHtml = items.length
            ? `<dl class="audit-detail-list">${items.map(([k, v]) => `<div class="audit-detail-item"><dt>${esc(k)}</dt><dd title="${esc(v)}">${esc(v)}</dd></div>`).join('')}</dl>`
            : '<span class="audit-empty-detail">无详情</span>';
          const tr = document.createElement('tr');
          tr.className = 'border-b border-cyan-900/30 align-top';
          tr.innerHTML = `
            <td class="py-4 pr-4 text-cyan-100/85">${esc(ts)}<br><span class="text-xs text-cyan-100/45">#${esc(e.seq)}</span></td>
            <td class="py-4 pr-4 text-cyan-100/85">${esc(action)}</td>
            <td class="py-4 pr-4 text-cyan-100/85">${esc(e.user || '-')}</td>
            <td class="py-4 pr-4">${badge}</td>
            <td class="py-4 text-cyan-100/75">${detailHtml}</td>`;
          rows.appendChild(tr);
          const card = document.createElement('article');
          card.className = 'log-card';
          card.innerHTML = `
            <div class="space-y-3">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <p class="section-title">${esc(action)}</p>
                  <h3 class="mt-2 text-sm font-semibold text-cyan-100">${esc(ts)}</h3>
                </div>
                ${badge}
              </div>
              <div class="text-sm leading-7 text-cyan-100/75">用户：${esc(e.user || '-')}<br>序号：#${esc(e.seq)}</div>
              ${detailHtml}
            </div>`;
          mobile.appendChild(card);
        }
      } catch (e) {
        if (e.status === 401 || e.status === 403) { location.href = '/'; return; }
        $('logsEmpty').classList.remove('hidden');
        $('logsEmpty').textContent = `读取日志失败：${e.message}`;
      }
    })();
    let idleRemaining = 60;
    const renderIdle = v => { const el = $('idle-countdown'); if (!el) return; el.textContent = `${String(Math.max(0, v)).padStart(2, '0')}s`; el.classList.toggle('is-warning', v <= 10); };
    ['pointerdown', 'pointermove', 'keydown', 'scroll', 'touchstart', 'click'].forEach(e => window.addEventListener(e, () => { idleRemaining = 60; renderIdle(60); }, { passive: true }));
    setInterval(() => { idleRemaining -= 1; renderIdle(idleRemaining); if (idleRemaining <= 0) doLogout(); }, 1000);
    async function doLogout() {
      try { await api('logout', { method: 'POST', body: {} }); } catch {}
      sessionStorage.removeItem('ev_priv'); sessionStorage.removeItem('ev_pass');
      location.href = '/';
    }
    $('btnLogout').onclick = doLogout;
    </script>
</body>
</html>
